name: Build

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      JVDP_AP_SSID: JvdP-LightSensor
      JVDP_AP_PASSWORD: CI-ONLY-NOT-FOR-DEPLOYMENT
      JVDP_OTA_PASSWORD: CI-ONLY-NOT-FOR-DEPLOYMENT
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build Windows applications and ESP firmware
        shell: pwsh
        run: ./build.ps1
      - name: Verify Darkroom navigation without desktop input
        shell: pwsh
        run: ./test-darkroom-navigation.ps1
      - name: Verify installer shortcut and crash restart handling
        shell: pwsh
        run: ./test-desktop-integration.ps1
      - name: Verify 10-size Windows layout matrix
        shell: pwsh
        run: ./test-layout-matrix.ps1 -SkipBuild
      - uses: actions/upload-artifact@v7
        with:
          name: jvdp-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
